[workspace]
members = [".", "helper"]

[package]
name = "deblestia-installer"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt", "process", "io-util", "sync", "macros"] }
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sys-info = "0.9"
dirs = "6"
glib = "0.20"
gio = "0.20"
anyhow = "1"
