# Debian Custom Manager component registry.
# Paths accept $HOME and $REPO. Lists use ';' as the separator.

[component:core]
name=Debian-Hyprland-Custom
description=Base du bureau personnalisé. Elle fournit l’installateur, l’updater et les fichiers communs. Indispensable.
required=true
detect_all=$REPO/install.sh;$REPO/update.sh
install_script=install.sh
uninstall_script=
details=README.md

[component:mpvpaper-engine]
name=MPVpaper Engine
description=Gère les fonds d’écran animés et leur automatisation. Optionnel : le bureau fonctionne sans lui.
required=false
detect_any=$HOME/.local/lib/mpvpaper-engine;$HOME/.local/bin/mpvpaper-engine-quick-menu
service=mpvpaper-engine.service
install_script=install-mpvpaper-engine.sh
uninstall_script=
details=config/mpvpaper-engine/README.md

[component:aurora]
name=Aurora Desktop
description=Composant d’interface du bureau Aurora. Optionnel et indépendant du gestionnaire central.
required=false
install_script=install-aurora.sh
uninstall_script=
details=docs/aurora-audit.md

[component:mirrorbridge]
name=MirrorBridge
description=Pont léger utilisé par certains éléments du bureau pour synchroniser des informations entre composants.
required=false
detect_command=mirrorbridge
install_script=install-mirrorbridge.sh
uninstall_script=
details=README.md

[component:nova-shell]
name=Nova Shell
description=Shell graphique optionnel du bureau. S’il manque, les autres composants installés restent utilisables.
required=false
detect_any=$HOME/.config/quickshell/deblestia-nova
install_script=install-nova-shell.sh
uninstall_script=
details=README.md

[component:pericored]
name=Pericored
description=Service de bas niveau utilisé par certaines fonctions de périphériques. Normalement géré avec les composants qui en ont besoin.
required=false
detect_any=$HOME/.local/lib/debian-next-v3/pericored
service=pericored.service
install_script=install-v3.sh
uninstall_script=
details=README.md
